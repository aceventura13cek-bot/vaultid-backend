<!DOCTYPE html>
<html>
<head>
<title>VaultID Login</title>

<style>
body{
font-family: Arial;
background:#0f172a;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.container{
background:#1e293b;
padding:30px;
border-radius:10px;
width:350px;
}

input{
width:100%;
padding:10px;
margin-top:10px;
border:none;
border-radius:5px;
}

button{
width:100%;
padding:12px;
margin-top:15px;
background:#3b82f6;
border:none;
color:white;
font-weight:bold;
border-radius:5px;
cursor:pointer;
}

button:hover{
background:#2563eb;
}

.hidden{
display:none;
}

</style>
</head>

<body>

<div class="container">

<h2>VaultID Login</h2>

<!-- STEP 1 EMAIL -->
<div id="step1">

<input id="email" placeholder="Enter Email">

<button onclick="requestChallenge()">Continue</button>

</div>

<!-- STEP 2 ZKP -->
<div id="step2" class="hidden">

<p>Challenge received:</p>

<b id="challengeBox"></b>

<input id="proof" placeholder="Enter Proof">

<button onclick="verifyProof()">Verify</button>

</div>

<!-- STEP 3 MFA -->
<div id="step3" class="hidden">

<input id="mfa" placeholder="Enter MFA Code">

<button onclick="verifyMFA()">Verify MFA</button>

</div>

</div>


<script>

let challengeValue = null
let accessToken = null


async function requestChallenge(){

const email = document.getElementById("email").value

const res = await fetch("http://127.0.0.1:8000/auth/challenge",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
email:email
})
})

const data = await res.json()

challengeValue = data.challenge

document.getElementById("challengeBox").innerText = challengeValue

document.getElementById("step1").classList.add("hidden")
document.getElementById("step2").classList.remove("hidden")

}


async function verifyProof(){

const email = document.getElementById("email").value
const proof = document.getElementById("proof").value

const res = await fetch("http://127.0.0.1:8000/auth/login",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

email:email,
proof:proof,
challenge:challengeValue

})

})

const data = await res.json()

accessToken = data.access_token

document.getElementById("step2").classList.add("hidden")
document.getElementById("step3").classList.remove("hidden")

}


async function verifyMFA(){

const code = document.getElementById("mfa").value

const res = await fetch("http://127.0.0.1:8000/auth/mfa/verify",{

method:"POST",

headers:{
"Content-Type":"application/json",
"Authorization":"Bearer "+accessToken
},

body:JSON.stringify({
code:code
})

})

const data = await res.json()

alert("Login successful!")

window.location.href="dashboard.html"

}

</script>

</body>
</html>
